  end_date: "2026-05-23"

portfolio:
  allocator: equal_weight
  capital: 1_000_000

strategies:
  rules:
    - name: pair_trading
      params:
        # 经过 walk-forward 验证的最优配对和参数
        # 配对筛选标准：p-value < 0.10 AND half-life < 60 天
        pairs:
          - ["600016", "601166"]  # 民生 vs 兴业 (p=0.097, hl=23天)
        entry_zscore: 1.2
        exit_zscore: 0.3
        lookback: 30
        beta_method: "ols"
      weight: 1.0

backtest:
  stop_loss: -0.08

risk:
  rules:
    - name: position_limit
      params: { max_weight: 0.3 }
    - name: tradability
    - name: t1
