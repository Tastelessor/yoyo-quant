# Production config: CSI 500 + Earnings Surprise (fundamental factor)
# Phase 16 final deliverable (2026-05-29)
# 3.4y walk-forward: Sharpe 0.930, MaxDD 14.4%, Total Return 36.9%
#
# Key design decisions:
#   - CSI 500 universe: mid-cap sweet spot for earnings_surprise factor
#     (analyst coverage sparse enough for alpha, liquid enough to trade)
#   - Industry neutralization: cross-sectional demeaning (+51% Sharpe)
#   - top_n=10: diversified enough to reduce concentration risk
#   - dead_zone=0.015: position smoothing to reduce unnecessary turnover
#
# Previous versions:
#   v1 (2026-05-28): CSI 300 + twin-star, Sharpe 0.820 (per-period avg)
#   v2 (2026-05-28): CSI 300 + earnings-only, Sharpe 0.978 (per-period avg)
#   v3 (2026-05-29): CSI 500 + earnings-only, Sharpe 0.930 (corrected overall)

universe:
  source: index
  index_code: "000905.SH"
  fetch_date: "2026-05-23"
  filters:
    exclude_st: true
  start_date: "2016-06-01"
  end_date: "2026-05-22"

portfolio:
  allocator: equal_weight
  capital: 1_000_000

neutralization:
  enabled: true
  method: demean
  min_peers: 3

strategies:
  # Single-stream: earnings surprise only
  # Twin-star (vwap + volatility) tested and rejected on CSI 500 (Sharpe -0.17)
  combiner:
    type: weighted_vote
    threshold: 0.0
  rules:
    - name: gtja_earnings_surprise
      params: { rebalance: 15, top_n: 10, bottom_n: 5 }
      weight: 1.0

backtest:
  stop_loss: null
  take_profit: null
  trading_cost:
    commission: 0.0001
    stamp_tax: 0.0005
    transfer_fee: 0.00001
    slippage_ticks: 1

risk:
  rules:
    - name: position_limit
      params: { max_weight: 0.2 }
    - name: tradability
    - name: t1
