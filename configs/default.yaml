portfolio:
  allocator: equal_weight
  capital: 1_000_000

strategies:
  # gtja_volume_price (18 volume/sentiment factors, 5 active by default):
  #   name: gtja_volume_price
  #   params:
  #     rebalance: 20
  #     top_n: 5
  #     bottom_n: 3
  #     weights:
  #       # Active (10y-validated):
  #       money_flow_6d: 1.0              # GTJA #11  — 6d directional pressure
  #       up_down_vol_26d: 1.0            # GTJA #40  — up/down volume ratio
  #       obv_6d: 1.0                     # GTJA #43  — OBV-like 6d
  #       shadow_ratio_20d: 1.0           # GTJA #118 — upper/lower shadow ratio ★
  #       return_1d_times_vol: 1.0        # GTJA #178 — daily return × volume ★
  #       # Disabled (weaker than baseline):
  #       vol_rank_intraday_corr_6d: 0.0  # GTJA #1
  #       vol_change_pct_5d: 0.0          # GTJA #80
  #       return_6d_times_vol: 0.0        # GTJA #29
  #       high_vol_rank_corr_3d: 0.0      # GTJA #32
  #       close_vol_rank_cov_5d: 0.0      # GTJA #99
  #       open_vol_corr_10d: 0.0          # GTJA #139
  #       vwap_vol_rank_corr_5d: 0.0      # GTJA #90
  #       williams_r_smoothed_6d: 0.0     # GTJA #47
  #       candle_body_vol_composite: 0.0  # GTJA #54
  #       open_vwap_close_vwap: 0.0       # GTJA #12
  #       dollar_vol_std_6d: 0.0          # GTJA #70
  #       vol_macd_9_26_12: 0.0           # GTJA #145
  #       vol_rsi_6d: 0.0                 # GTJA #102
  # Regime switch: route to different strategies based on market regime.
  # When regime_switch is set, it takes priority over combiner+rules.
  regime_switch:
    regimes:
      trend_up:
        name: gtja_momentum
        params: { rebalance: 20, top_n: 5, bottom_n: 3 }
      trend_down:
        name: reversed_gtja_vwap
        params: { rebalance: 20, top_n: 5, bottom_n: 3 }
      range:
        name: reversed_gtja_vwap
        params: { rebalance: 20, top_n: 5, bottom_n: 3 }
      volatile:
        name: gtja_volatility
        params: { rebalance: 20, top_n: 5, bottom_n: 3 }
  # Fallback: combiner+rules used when regime_switch is not set.
  combiner:
    type: weighted_vote
    threshold: 0.0
  rules:
    - name: mean_reversion
      params: { window: 20, num_std: 2.0 }
      weight: 0.5
    - name: rsi_reversal
      params: { window: 14, oversold: 30, overbought: 70 }
      weight: 0.5

risk:
  rules:
    - name: fixed_stop_loss
      params: { threshold: -0.08 }
    - name: position_limit
      params: { max_weight: 0.3 }
    - name: tradability
    - name: t1
